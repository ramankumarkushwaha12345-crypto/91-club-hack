<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>91App - Register</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            margin: 20px; 
            background-color: #f4f4f9;
        }
        .container { 
            max-width: 500px; 
            margin: auto; 
            padding: 20px; 
            background: white; 
            border: 1px solid #ddd; 
            border-radius: 10px; 
            box-shadow: 0px 4px 8px rgba(0,0,0,0.1);
        }
        .logo { 
            max-width: 150px; 
            margin-bottom: 15px; 
        }
        .btn { 
            display: inline-block; 
            padding: 10px 20px; 
            margin: 10px 0; 
            background-color: #0088cc; 
            color: white; 
            text-decoration: none; 
            border-radius: 5px; 
            font-weight: bold;
        }
        .gift-code { 
            font-size: 18px; 
            font-weight: bold; 
            color: #d9534f; 
            margin: 15px 0; 
            padding: 10px;
            border: 1px dashed #d9534f;
            background-color: #fdf2f2;
        }
        iframe { 
            width: 100%; 
            height: 400px; 
            border: none; 
            margin-top: 20px; 
            border-radius: 5px;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- App Logo yahan change karein -->
        <img src="YOUR_LOGO_URL_HERE.png" alt="App Logo" class="logo">

        <!-- App Name -->
        <h2>91App Registration</h2>

        <!-- Gift Code yahan likhein -->
        <div class="gift-code">Gift Code: YOUR_GIFT_CODE_HERE</div>

        <!-- Telegram Link yahan change karein -->
        <a href="YOUR_TELEGRAM_LINK_HERE" class="btn">Join our Telegram</a>

        <!-- Iframe with your provided link -->
        <iframe src="https://www.91appj.com/#/register?invitationCode=7777715120361"></iframe>
    </div>
</body>
</html>
